name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Timing samples for choosing the perf runner: `Perf (deterministic)` on one
  # fixed commit pair, on the chosen runner. Other jobs do not run.
  workflow_dispatch:
    inputs:
      perf_runner:
        description: Runner for Perf (deterministic)
        type: choice
        options:
          - ubuntu-latest
          - ubicloud-standard-4
          - ubicloud-standard-8
        default: ubuntu-latest
      head_sha:
        description: Full commit SHA to measure
        type: string
        required: true
      base_sha:
        description: Full commit SHA to compare against
        type: string
        required: true

jobs:
  rust:
    name: Rust workspace
    # A dispatch would test the dispatched branch, not `head_sha`.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Normally 3-4 minutes; a hung test should fail fast, not run for hours.
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the same version as `rust-toolchain.toml`, which the
      # contributor shell reads. `@stable` here would float while devenv's
      # pinned inputs do not, which is how the dev shell ended up four
      # releases behind CI. Bump both in the same change.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Keeps compiled dependencies in target/ between runs. Pushes to main
      # save the cache that pull requests restore.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # CI intentionally uses the explicit Rust toolchain above rather than the
  # contributor devenv environment. Pass `--build-cmd cargo` so the performance
  # controller builds both revisions with that same CI toolchain.
  #
  # Nearly all of this job is release builds: `perf ab` builds each side into
  # its own target directories. rust-cache keeps both trees' compiled
  # dependencies. Pull requests can only restore caches saved on main, so
  # pushes to main also run the comparison (against the previous main commit)
  # and save the cache that pull requests start from.
  #
  # `workflow_dispatch` measures `head_sha` against `base_sha` on
  # `perf_runner`, to compare runners on one fixed pair. Both SHAs must be
  # ancestors of `main`: checkout accepts any commit the repository can
  # reach, including fork pull-request heads under `refs/pull/*`, so dispatch
  # permission alone would not keep a fork's build scripts off a paid runner.
  # Pull requests and pushes stay on `ubuntu-latest`.
  perf-deterministic:
    name: Perf (deterministic)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_runner || 'ubuntu-latest' }}
    # Normally 5-10 minutes with the build cache, about 20 without it.
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      # A dispatch with a malformed SHA must fail, not fall back to the
      # dispatched branch: a run of some other commit is not a sample.
      - name: Check dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::head_sha and base_sha must be full 40-character commit SHAs, got '$sha'"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || '' }}

      # Provenance before any build step: both sides must already be on
      # `main`, not merely reachable. Fetched explicitly so the check does not
      # depend on which refs checkout happened to bring along.
      - name: Confirm dispatched commits are on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::checked out $(git rev-parse HEAD), expected head_sha $HEAD_SHA"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main 2>/dev/null; then
              echo "::error::$sha is not on main; dispatch only measures commits already merged to main"
              exit 1
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # A new branch or force-push has no usable previous commit to compare.
      # A dispatch always names its base, so a missing one fails instead.
      - name: Materialize base
        id: base
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git worktree add .perf/base "$BASE_SHA"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$DISPATCH" = true ]; then
            echo "::error::base_sha $BASE_SHA is not a commit in this repository"
            exit 1
          else
            echo "No base commit to compare against; skipping."
          fi

      # After the worktree exists: restoring .perf/base/target first would
      # make `git worktree add` refuse a non-empty directory.
      - name: Cache Rust builds
        id: cache
        if: steps.base.outputs.available == 'true'
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: perf
          workspaces: |
            . -> target
            .perf/base -> target

      # Build the controller into the same target directory `perf ab` uses for
      # the current side (`target/release-root`), so Compare reuses this build
      # instead of compiling the current revision a second time.
      - name: Build yach-bench
        if: steps.base.outputs.available == 'true'
        run: cargo build --release --locked -p yach-bench
        env:
          CARGO_TARGET_DIR: target/release-root

      - name: Compare
        if: steps.base.outputs.available == 'true'
        run: ./target/release-root/release/yach-bench perf ab --base-dir .perf/base --deterministic --rounds 1 --build-cmd cargo --out ab.json

      - name: Summarize
        if: always() && steps.base.outputs.available == 'true'
        run: ./target/release-root/release/yach-bench perf report ab.json >> "$GITHUB_STEP_SUMMARY"

      # A dispatch run without a comparison document is not a timing sample.
      # `Compare` exits non-zero on a regressed verdict and still writes the
      # document, so this runs after any outcome.
      - name: Check comparison document
        if: always() && github.event_name == 'workflow_dispatch' && steps.base.outputs.available == 'true'
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          PERF_RUNNER: ${{ inputs.perf_runner }}
        run: |
          if [[ ! -s ab.json ]]; then
            echo "::error::ab.json is missing or empty"
            exit 1
          fi
          {
            echo ""
            echo "Runner: $PERF_RUNNER; head: $HEAD_SHA; base: $BASE_SHA; rust-cache exact hit: ${CACHE_HIT:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison document
        if: always() && github.event_name == 'workflow_dispatch' && steps.base.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ inputs.perf_runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ab.json
          if-no-files-found: error

  # Opt-in wall-clock gate for the headless TUI rows whose shared-runner A/A
  # spread was tight enough to budget. Size and count stay on
  # `Perf (deterministic)`; every other latency row stays manual. Evidence
  # and the manual-row policy: docs/project/records/2026-10-15-ci-tui-latency-gate.md.
  #
  # Pull requests only. Unlike the deterministic job, a push to main has no
  # second tree worth measuring here, and pull requests restore the `perf`
  # cache that job already saves.
  perf-latency:
    name: Perf (latency)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One release build of the controller plus two rounds of four in-process
    # rows. With a warm cache this is minutes; a cold cache rebuilds both
    # sides. Bounded so a hung sampler fails the job instead of the workflow.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # A new branch or force-push has no usable previous commit to compare.
      - name: Materialize base
        id: base
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git worktree add .perf/base "$BASE_SHA"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No base commit to compare against; skipping."
          fi

      # After the worktree exists: restoring .perf/base/target first would
      # make `git worktree add` refuse a non-empty directory.
      - name: Cache Rust builds
        if: steps.base.outputs.available == 'true'
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: perf
          workspaces: |
            . -> target
            .perf/base -> target

      # Build the controller into the same target directory `perf ab` uses for
      # the current side (`target/release-root`), so Compare reuses this build
      # instead of compiling the current revision a second time.
      - name: Build yach-bench
        if: steps.base.outputs.available == 'true'
        run: cargo build --release --locked -p yach-bench
        env:
          CARGO_TARGET_DIR: target/release-root

      # `--rounds` > 1 so the first round is not the only evidence. `perf ab`
      # takes one `--filter` glob, and glob 0.3 does not expand braces, so
      # each gated row is its own exact-id comparison. Exit 1 on
      # error/regressed fails the job. Exit 2 (inconclusive) is recorded and
      # does not: on a shared runner a within-budget delta with a wide base
      # spread is noise, not a regression. A missing document is a harness
      # failure, not a verdict. Exit codes are ranked by severity, not by
      # value: one row's inconclusive 2 must not hide another row's 1.
      - name: Compare
        id: compare
        if: steps.base.outputs.available == 'true'
        run: |
          set +e
          rows=(
            viewport/huge_transcript_scroll_headless/10000
            keypress/active_stream_on_history_headless/100
            replay/heavy_tool_output_tail_headless/102400
            startup/backend_ready_to_first_interactive_headless
          )
          worst=0
          severity() {
            case "$1" in
              0) echo 0 ;;
              2) echo 1 ;;
              1) echo 2 ;;
              *) echo 3 ;;
            esac
          }
          for row in "${rows[@]}"; do
            slug="${row//\//_}"
            ./target/release-root/release/yach-bench perf ab \
              --base-dir .perf/base \
              --filter "$row" \
              --rounds 2 \
              --build-cmd cargo \
              --out "ab-${slug}.json"
            rc=$?
            echo "$row exit=$rc"
            if [[ ! -s "ab-${slug}.json" ]]; then
              echo "no document for $row" >&2
              exit 1
            fi
            if (( $(severity "$rc") > $(severity "$worst") )); then
              worst=$rc
            fi
          done
          set -e
          echo "exit=$worst" >> "$GITHUB_OUTPUT"
          if [[ "$worst" -eq 1 ]]; then
            echo "latency comparison regressed or errored" >&2
            exit 1
          fi
          if [[ "$worst" -gt 2 ]]; then
            echo "latency comparison failed to run (exit $worst)" >&2
            exit "$worst"
          fi

      - name: Summarize
        if: always() && steps.base.outputs.available == 'true'
        run: |
          shopt -s nullglob
          for doc in ab-*.json; do
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ${doc%.json}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            ./target/release-root/release/yach-bench perf report "$doc" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "${{ steps.compare.outputs.exit }}" == "2" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Inconclusive: a gated row did not settle (exit 2). This does not fail the job; read the verdicts above." >> "$GITHUB_STEP_SUMMARY"
          fi
