name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # This job does not use `just dev`: flake.nix locks nix-config to a private
  # git+ssh input that GitHub Actions cannot fetch. The spec's "just dev cargo"
  # paragraph is amended by Task 15; here we match the rust job's pinned
  # dtolnay/rust-toolchain + bare cargo, and pass `--build-cmd cargo` so the
  # controller builds both sides the same way.
  perf-deterministic:
    name: Perf (deterministic)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Materialize base
        run: git worktree add .perf/base "${{ github.event.pull_request.base.sha }}"

      - name: Build yach-bench
        run: cargo build --release --locked -p yach-bench

      - name: Compare
        run: ./target/release/yach-bench perf ab --base-dir .perf/base --deterministic --rounds 1 --build-cmd cargo --out ab.json

      - name: Summarize
        if: always()
        run: ./target/release/yach-bench perf report ab.json >> "$GITHUB_STEP_SUMMARY"
