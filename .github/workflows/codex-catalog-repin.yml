name: Codex catalog re-pin

# Proposes a PR when a newer stable openai/codex release changes the baked
# Codex catalog. The branch push and PR use a GitHub App installation token:
# runs triggered by a GITHUB_TOKEN-created PR wait for manual approval, while
# the app's PR runs CI unattended. Requires repository variable
# REPIN_APP_CLIENT_ID and secret REPIN_APP_PRIVATE_KEY for an app installed
# on this repository with Contents and Pull requests write access.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repin:
    name: Re-pin baked Codex catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPIN_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Snapshot latest stable release
        run: just catalog-codex-snapshot

      # Any PR for the branch, open or closed, suppresses a new one: a PR the
      # owner closed without merging means "not this release", and pushing
      # to its branch again would be rejected as non-fast-forward.
      - name: Open PR when the pin changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/yach-catalog/data; then
            echo "pin unchanged"; exit 0
          fi
          tag="$(cut -d' ' -f1 crates/yach-catalog/data/codex-models.pin)"
          branch="codex-catalog/${tag}"
          existing="$(gh pr list --head "$branch" --state all --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "PR for $branch already exists"; exit 0
          fi
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/${bot}" --jq .id)+${bot}@users.noreply.github.com"
          git switch -c "$branch"
          git add crates/yach-catalog/data
          git commit -m "Re-pin baked Codex catalog to ${tag}"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Re-pin baked Codex catalog to ${tag}" \
            --body "Automated by .github/workflows/codex-catalog-repin.yml. Review the codex-models.json diff."
