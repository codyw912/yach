[workspace]
members = [
    "crates/yach-backend",
    "crates/yach-bench",
    "crates/yach-catalog",
    "crates/yach-hashline-extension",
    "crates/yach-jev-reviewer",
    "crates/yach-connections",
    "crates/yach-cli",
    "crates/yach-proto",
    "crates/yach-trace",
    "crates/yach-ui",
]
exclude = ["vendor/rig-core"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"

allow_attributes = "deny"

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

await_holding_lock = "deny"

exit = "deny"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"


[patch.crates-io]
rig-core = { path = "vendor/rig-core" }

# Keep backtrace locations without full debugger data in routine builds and tests.
[profile.dev]
debug = "line-tables-only"

# Opt in with `just dev cargo build --profile debug-full` (or `cargo test`).
[profile.debug-full]
inherits = "dev"
debug = 2