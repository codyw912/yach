# Numeric budgets per workload id glob. Most specific (longest literal
# prefix) row wins; fields not set fall back to [defaults]. There is no
# reason-only waiver: an intentional regression raises the budget here,
# in the same change, so the reviewer sees it against a named workload.
# `comment` is documentation only.

[defaults]
latency_pct = 5.0
memory_pct = 10.0
size_pct = 0.5
count = 0

[[workload]]
id = "turn/scripted/*"
latency_pct = 8.0
comment = "scripted turns include tokio scheduling; wider budget"

[[workload]]
id = "yach/*_first_output_pty"
latency_pct = 16.0
comment = "ceil(spread)+3 from .perf/results/20260910T123936-ab.json: tui_startup base_spread 12.13% median delta -1.19%; tui_ready 6.66% / +1.43%. Widest ceil(12.13)+3 = 16. Glob is *_first_output_pty so profile first-render rows keep the 5% default."

[[workload]]
id = "yach/cli_startup_first_output"
latency_pct = 6.0
comment = "ceil(spread)+3 from .perf/results/20260910T123936-ab.json: base_spread 2.84%, median delta -4.05%. ceil(2.84)+3 = 6."

[[workload]]
id = "startup/phase/*"
latency_pct = 10.0

[[workload]]
id = "extension/activation/*"
latency_pct = 32.0
comment = "ceil(spread)+3 on p95, the statistic the latency gate judges (ab.rs:892), from six 30-sample runs on 2026-09-13: spawn 28.92%, handshake 21.60%, total 16.83%. Widest ceil(28.92)+3 = 32. A budget this wide gates almost nothing: treat these rows as trend evidence and read the absolutes, not the verdict. Tightening needs a less noisy sampler, tracked on plane:YACH-8. Deriving from p50 instead would have produced 13.0 and false-failed honest changes."

[[workload]]
id = "extension/execute/*"
latency_pct = 48.0
comment = "ceil(spread)+3 on p95 from six 30-sample runs on 2026-09-13: one_call 18.33%, tools_4_total 44.85%. Widest ceil(44.85)+3 = 48, so this row cannot catch a regression smaller than roughly half its own value; it is trend evidence. Rows measure `execute_with_resources`, which includes registry lookup, permission check, shared-invoker mutex wait and argument cloning, not only the host call. An earlier round_trip_last row (fourth call only) spread 26.51% on p50 and was dropped rather than gated uselessly."

[[workload]]
id = "binary/size_bytes"
size_pct = 5.0
comment = "Deliberate headroom while the product is still expanding, not a target: feature-sized PRs necessarily grow the binary, and a budget fitted to each one's measurement would need raising on the next. The per-PR rule does not bound cumulative growth, so this row is a stopgap until size is also tracked against a fixed reference; tighten it once expansion slows. Set at 5.0 in PR #278 (intent-aware auto-review), which measured 26946880 -> 28158864 (+4.50%, .text +941260) against main; its only new crate in the yach binary is yach-jev-reviewer, dependency features unchanged, and the rest is review code plus generic duplication (similar's myers routines 3 -> 14 monomorphized copies with no new caller). Earlier: session-log batching + deferred fsync measured +1.00% against the 0.5% default."

[[workload]]
id = "*#alloc_count"
count = 0

[[workload]]
id = "*#alloc_bytes"
count = 0

[[workload]]
id = "keypress/active_stream_on_history_headless/100#alloc_bytes"
count = 96
comment = "theming engine PR #308: measured 63365664 -> 63365760 (+96 bytes) against main 4a751250, after removing tool-body Vec growth, intermediate wrapping/surface vectors and owned one-space padding. Inferred net remainder: the state rule and separate title/summary roles retain extra styled spans in cached and visible tool rows; the rule also narrows wrapping by one column. Allocation count improves 41898 -> 40566 (-1332). Budgeted at the measured byte delta exactly."

[[workload]]
id = "turn/scripted/text_only#alloc_bytes"
count = 1144
comment = "session diagnostics (PR #283): measured 333406 -> 334550 (+1144 bytes) against main. Inferred, not isolated: each provider attempt now builds an AttemptLabel and a ProviderAttemptFinished event (owned session, turn, and model strings) and appends it directly to the store as one serialized line. Budgeted at the measured delta exactly, so any further growth fails. Earlier rows: intent-aware auto-review (PR #278) +1536; session approval grants +128."

[[workload]]
id = "turn/scripted/text_only#alloc_count"
count = 12
comment = "session diagnostics (PR #283): measured 2553 -> 2565 (+12) against main, after removing the event clone on the store path (runner.rs AttemptSink::record). Same inferred cause as the alloc_bytes row. Budgeted at the measured delta exactly."

[[workload]]
id = "turn/scripted/tools_4/builtin#alloc_bytes"
count = 1552
comment = "session diagnostics (PR #283): measured 593610 -> 595162 (+1552 bytes) against main. Same inferred cause as the text_only row, for the turn's provider attempts. Budgeted at the measured delta exactly. Earlier row: intent-aware auto-review (PR #278) +1536."

[[workload]]
id = "turn/scripted/tools_4/builtin#alloc_count"
count = 23
comment = "session diagnostics (PR #283): measured 4586 -> 4609 (+23) against main, after removing the event clone on the store path. Same inferred cause as the alloc_bytes row. Budgeted at the measured delta exactly."

[[workload]]
id = "review/route/*"
latency_pct = 10.0
comment = "first landing: no baseline measurement yet; inconclusive acceptable per convention"

[[workload]]
id = "viewport/huge_transcript_scroll_headless/10000"
latency_pct = 10.0
comment = "ceil(spread)+3 on p95 from three 20-sample A/A runs on a shared GitHub runner, run 38737173763 (2026-10-15, commit 9c54bc4e): base_spread 4.84%, 1.96%, 6.43%. Widest ceil(6.43)+3 = 10. The 6.43% run was inconclusive against the 5% default and unchanged against this budget."

[[workload]]
id = "keypress/active_stream_on_history_headless/100"
latency_pct = 6.0
comment = "ceil(spread)+3 on p95 from three 20-sample A/A runs on a shared GitHub runner, run 38737173763 (2026-10-15, commit 9c54bc4e): base_spread 2.46%, 1.68%, 0.80%. Widest ceil(2.46)+3 = 6. Unchanged on every run."

[[workload]]
id = "replay/heavy_tool_output_tail_headless/102400"
latency_pct = 8.0
comment = "ceil(spread)+3 on p95 from three 20-sample A/A runs on a shared GitHub runner, run 38737173763 (2026-10-15, commit 9c54bc4e): base_spread 4.19%, 3.01%, 1.71%. Widest ceil(4.19)+3 = 8. Unchanged on every run."

[[workload]]
id = "startup/backend_ready_to_first_interactive_headless"
latency_pct = 10.0
comment = "ceil(spread)+3 on p95 from three 20-sample A/A runs on a shared GitHub runner, run 38737173763 (2026-10-15, commit 9c54bc4e): base_spread 4.01%, 6.34%, 4.77%. Widest ceil(6.34)+3 = 10. The 6.34% run was inconclusive against the 5% default and unchanged against this budget."
