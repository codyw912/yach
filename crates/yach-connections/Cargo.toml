[package]
name = "yach-connections"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codyw912/yach"
description = "Durable provider connection metadata and credentials for yach"

[dependencies]
fs2 = "0.4.3"
keyring = "4.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
parking_lot = "0.12"

[lints]
workspace = true
