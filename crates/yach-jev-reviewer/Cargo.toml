[package]
name = "yach-jev-reviewer"
version = "0.1.0"
edition = "2024"
description = "First-party TypeSafe Jev reviewer extension for yach"
license = "MIT"
repository = "https://github.com/codyw912/yach"
publish = false

[lib]
path = "src/main.rs"

[[bin]]
name = "yach-jev-reviewer"
path = "src/bin.rs"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
