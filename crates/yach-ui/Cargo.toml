[package]
name = "yach-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codyw912/yach"
description = "Terminal UI primitives for yach"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
ratatui-textarea = "0.9.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
tokio-stream = "0.1"
tokio-util = "0.7"
unicode-width = "0.2"
zeroize = "1.8"
yach-proto = { version = "0.1.0", path = "../yach-proto" }

[lints]
workspace = true
