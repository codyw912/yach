[package]
name = "yach-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codyw912/yach"
description = "Backend runner seams for yach"

[features]
default = []
bench = []

[dependencies]
futures = "0.3"
globset = "0.4"
libc = "0.2"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rig = { package = "rig-core", version = "0.41.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "3.2.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"
yach-proto = { version = "0.1.0", path = "../yach-proto" }
yach-connections = { version = "0.1.0", path = "../yach-connections" }

[lints]
workspace = true
