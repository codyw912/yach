[package]
name = "yach-backend"
version = "0.1.0"
edition = "2024"
description = "Backend runner seams for yach"

[features]
default = []
bench = []

[dependencies]
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rig-core = { version = "0.36.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
yach-proto = { path = "../yach-proto" }

[lints]
workspace = true
